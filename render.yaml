# Blueprint de Render: crea la base PostgreSQL y el servicio web juntos.
# En Render: New > Blueprint > selecciona este repositorio.
databases:
  - name: novaacademy-db
    plan: free
    databaseName: novaacademy
    user: novaacademy

services:
  - type: web
    name: novaacademy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login.php
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novaacademy-db
          property: connectionString
